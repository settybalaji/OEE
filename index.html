
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Task Manager</h1>
        <p>Organize your daily activities easily</p>
    </header>

    <main class="container">

        <section class="task-box">
            <h2>Add Your Task</h2>

            <input type="text" id="taskInput"
                placeholder="Enter your task">

            <button onclick="addTask()">Add Task</button>
        </section>

        <section class="task-list">
            <h2>My Tasks</h2>

            <div class="summary">
                <span>Total: <strong id="total">0</strong></span>
                <span>Completed: <strong id="completed">0</strong></span>
                <span>Pending: <strong id="pending">0</strong></span>
            </div>

            <ul id="taskList"></ul>
        </section>

    </main>

    <footer>
        <p>Student Task Manager | Built using HTML, CSS and JavaScript</p>
        <p>Deployed using GitHub Pages</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
